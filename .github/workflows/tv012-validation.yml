name: Validar TV 0.1.12
on:
  push:
    branches: [fix/tv-0.1.12-continue-specials]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enumerar tareas existentes
        run: |
          chmod +x gradlew
          ./gradlew :app:tasks --all --console=plain > tv-tasks.txt
          python3 - <<'PY'
          from pathlib import Path
          tasks={line.split()[0] for line in Path('tv-tasks.txt').read_text().splitlines() if line.strip()}
          required={'testTvDebugUnitTest','testMobileDebugUnitTest','lintTvDebug','assembleTvDebug','compileMobileDebugKotlin'}
          assert required <= tasks, required-tasks
          Path('tv-release-task.txt').write_text(':app:assembleTvRelease' if 'assembleTvRelease' in tasks else '')
          PY
      - name: Tests, Lint TV y compilaciones (sin credenciales privadas)
        run: |
          ./gradlew :app:testTvDebugUnitTest :app:testMobileDebugUnitTest :app:lintTvDebug :app:compileMobileDebugKotlin :app:assembleTvDebug $(cat tv-release-task.txt) --console=plain '-Pandroid.injected.testOnly=false' '-Pandroid.injected.build.abi=armeabi-v7a,arm64-v8a,x86,x86_64'
      - name: Contratos y APK (firma CI, no distribución familiar)
        run: |
          python3 tools/check_tv012_contract.py
          python3 tools/check_tv0111_contract.py
          python3 tools/check_tv0111_lint_contract.py
          python3 tools/test_tv_physical_apk.py
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          python3 tools/verify_tv_physical_apk.py app/build/outputs/apk/tv/debug/app-tv-debug.apk --apksigner "$apksigner" > tv-apk-verification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-0.1.12-validacion
          path: |
            tv-tasks.txt
            tv-release-task.txt
            tv-apk-verification.txt
            app/build/reports/
          if-no-files-found: warn
