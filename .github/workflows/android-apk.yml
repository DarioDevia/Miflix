name: Compilar MiFlix cliente
on:
  workflow_dispatch:
  push:
    branches: [miflix-cliente, miflix-tv]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testMobileDebugUnitTest testTvDebugUnitTest assembleMobileDebug assembleTvDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiFlix-mobile-tv-diagnostico
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
